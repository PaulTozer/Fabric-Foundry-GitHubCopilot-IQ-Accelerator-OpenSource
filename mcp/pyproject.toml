[project]
name = "enterprise-iq-mcp"
version = "0.1.0"
description = "MCP server surfacing the EnterpriseKG ontology, lakehouse, and M4/M6/M7 paths for EnterpriseIQ."
requires-python = ">=3.11"
authors = [{ name = "Paul Tozer" }]

dependencies = [
    "PyJWT[crypto]>=2.10.1,<3",
    "github-copilot-sdk==1.0.15",
    "mcp[cli]==1.30.0",
    "httpcore>=1.0,<2",
    "azure-identity>=1.18",
    "aiohttp>=3.10,<4",
    "azure-ai-projects>=1.0.0b6",
    "azure-ai-agents>=1.1.0b3",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "openai>=1.45",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.24"]
crowd = ["jupedsim>=1.4,<2", "shapely>=2.0,<3", "matplotlib>=3.7,<4", "numpy>=1.26,<3"]
provisioning = ["pyarrow>=18", "deltalake>=0.25"]

[project.scripts]
enterprise-iq-mcp = "enterprise_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enterprise_mcp*"]
